<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover permite usar el área segura en pantallas con notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <title>Prestadiario</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Configuracion editable en el servidor (URL del backend). Se carga antes
         que el modulo de la app para que este la encuentre ya definida. La ruta
         es absoluta a proposito: con el fallback de la SPA, una ruta relativa
         se resolveria mal en direcciones como /clientes. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
